name: Build Hesabyar APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
  uses: android-actions/setup-android@v3
  with:
    cmdline-tools-version: 12266719

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q hesabyar_android_project.zip -d extracted

      - name: Build APK
        run: gradle --no-daemon -p extracted/hesabyar_android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hesabyar-APK
          path: extracted/hesabyar_android/app/build/outputs/apk/debug/*.apk
